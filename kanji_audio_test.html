<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かんじたんけん 音声テスト</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:560px;margin:auto;padding:22px;line-height:1.7}button{font-size:19px;padding:15px;margin:8px 0;width:100%;border:0;border-radius:12px;background:#2256b5;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f4f6;padding:12px;border-radius:10px}small{color:#555}</style></head><body><h1>🔊 音声テスト</h1><p>Safariで開いて、①→②の順番に押してね。音量を上げて、Bluetoothの接続先も確認してね。</p><button id="beep">① ピーという音を鳴らす</button><button id="speech">② 「ちょうしょく」を読み上げる</button><button id="voices">③ 日本語音声を確認</button><button id="stop">停止</button><h2>テスト結果</h2><pre id="log">まだテストしていません</pre><small>このテストはインターネットに音声データを送信しません。</small><script>
const log=document.getElementById('log');function say(t){log.textContent=(new Date).toLocaleTimeString()+' '+t+'\n'+(log.textContent==='まだテストしていません'?'':log.textContent).slice(0,2500)};
let ctx,active;
document.getElementById('beep').onclick=async()=>{try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=660;g.gain.value=.16;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.5);say('① ビープ音を再生。AudioContext='+ctx.state)}catch(e){say('① エラー '+e.message)}};
document.getElementById('speech').onclick=()=>{try{if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){say('② 音声合成APIなし');return}const s=window.speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance('ちょうしょく');active=u;u.lang='ja-JP';u.rate=.85;u.volume=1;u.onstart=()=>say('② onstart：読み上げ開始');u.onend=()=>say('② onend：読み上げ終了');u.onerror=e=>say('② onerror：'+e.error);s.speak(u);say('② 再生指示を送信。speaking='+s.speaking+' pending='+s.pending+' paused='+s.paused);setTimeout(()=>say('② 2秒後 speaking='+s.speaking+' pending='+s.pending+' paused='+s.paused),2000)}catch(e){say('② 例外 '+e.message)}};
document.getElementById('voices').onclick=()=>{if(!window.speechSynthesis){say('③ 音声合成APIなし');return}let v=speechSynthesis.getVoices();say('③ 音声数 '+v.length+' / 日本語: '+(v.filter(x=>x.lang.toLowerCase().startsWith('ja')).map(x=>x.name+' ('+x.lang+')').join(', ')||'なし'))};
document.getElementById('stop').onclick=()=>{speechSynthesis?.cancel();say('停止しました')};
</script></body></html>
